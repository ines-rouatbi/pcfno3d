# PC-FNO3D Tunisie : le principe de la v7 (FNO 3D + loss physique, cible u, v, w, rho aux
# noeuds 3D, niveaux au-dessus de la mer) sur TOUTE la Tunisie, avec un autre jeu de donnees :
#   capteurs : les anemometres des 12 aeroports (METAR, vent horizontal a 10 m, T, HR, p) ;
#   verite   : ERA5 (grille 0,25 deg, ~23 x 28 km), du sol a 1 000 m au-dessus du sol.
# Jeu et cache construits par `python scripts/tunisie_fno3d.py construire` (pcfno3d.tunisie_fno3d).
# Un modele DISTINCT de la v7, qui reste le modele servi et fige.
#
#   python -m pcfno3d -c tunisie_fno3d train
#   python -m pcfno3d -c tunisie_fno3d evaluate
name: tunisie_fno3d

paths:
  data_dir: C:/Users/inesr/AppData/Local/pcfno3d/tunisie_fno3d/jeu
  cache_dir: C:/Users/inesr/AppData/Local/pcfno3d/tunisie_fno3d/cache
  run_dir: C:/Users/inesr/AppData/Local/pcfno3d/runs/tunisie_fno3d
  cache_mirror: null

model:
  width: 32                 # v7 : 48 ; 32 pour un entrainement sur CPU (1,5 s par pas de 4)
  modes: [6, 12, 10]        # (z, y, x) bornes par la grille 22 x 32 x 19 (+ rembourrage)
  n_layers: 4
  pad: [4, 8, 8]
  proj_hidden: 128
  local_conv: true
  pool_surface: false       # un capteur = une maille, pas de bloc a agreger

train:
  epochs: 60
  steps_per_epoch: 100
  val_samples: 64
  batch_size: 4
  accum_steps: 1
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_phys_epochs: 6
  num_workers: 0
  ema_decay: 0.995          # 6 000 pas en tout (v7 : 28 000 a 0,999)
  grad_clip: 1.0
  save_every: 5
  seed: 42

loss:
  lambda_mass: 1.0
  mass_ref: 1.0e-8          # fixe par le residu de la verite ERA5 (scripts/tunisie_fno3d.py masse)
  lambda_bc: 0.1
  lambda_smooth: 0.0
  lambda_grad: 0.15
  w_weight: 1.0
  w_level_max: 25.0

mask:
  keep_train: [0.5, 1.0]    # 12 stations : en garder au moins la moitie
  p_full: 0.3               # une part des exemples avec toutes les stations (production)
  keep_eval: 1.0            # evaluation : toutes les stations disponibles

dso:                        # memes seuils que la v7
  rmse: 0.5
  r2: 0.95
  r2_all: 0.95
  mass_rms: 1.0e-4
  roughness_range: [0.9, 1.1]
  time_s: 1.0
  rmse_25pct: 0.7
  min_level_cover: 0.05

terrain_smooth_m: 0.0       # orographie ERA5 deja a l'echelle de la grille
f_coriolis: 8.13e-5         # s-1, latitude centrale 33,9 N
capteurs_min_plan: 4        # plan de pression sur les aeroports (12 au plus)
