# PC-FNO3D reel (Grand Tunis) : entrainement sur GPU dans Colab (A100), depart des poids v7.
# Carnets : notebooks/current/pcfno3d_grand_tunis_generation_colab.ipynb (jeu, CPU) puis
# notebooks/current/pcfno3d_grand_tunis_colab.ipynb (entrainement, A100). Voir configs/grand_tunis.yaml.
#   jeu et cache : disque local de Colab, recopies du Drive (cache_partie_1..3.zip, jeu.zip) ;
#   checkpoints  : disque local a chaque epoque, recopies sur le Drive toutes les 5 epoques.
name: grand_tunis

paths:
  data_dir: /content/grand_tunis/jeu
  cache_dir: /content/grand_tunis/cache
  run_dir: /content/drive/MyDrive/pcfno3d_grand_tunis/runs/grand_tunis
  cache_mirror: null
  local_dir: /content/run_local_grand_tunis
  web_dir: /content/grand_tunis/web

model:                      # architecture v7 exacte : les poids v7 servent de depart
  width: 48
  modes: [6, 32, 32]
  n_layers: 4
  pad: [4, 8, 8]
  proj_hidden: 128
  local_conv: true
  pool_surface: true
  recalcul_activations: false   # le carnet passe a true si la memoire du GPU ne suffit pas

train:
  epochs: 40
  steps_per_epoch: 200
  val_samples: 64
  batch_size: 1
  accum_steps: 2
  lr: 3.0e-4                # depart des poids v7
  weight_decay: 1.0e-4
  warmup_phys_epochs: 3
  num_workers: 4
  ema_decay: 0.999
  grad_clip: 1.0
  save_every: 5
  seed: 42
  init_from: /content/drive/MyDrive/pcfno3d_grand_tunis/best_dso_v7.pt
  select_by: val_score

loss:
  lambda_mass: 1.0
  mass_ref: 5.0e-7          # comme la v7 : la verite generee conserve la masse au meme schema
  lambda_bc: 0.1
  lambda_smooth: 0.0
  lambda_grad: 0.15
  w_weight: 1.0
  w_level_max: 25.0

mask:
  entree: era5_stations     # ERA5 10 m tous les 2,5 km + anemometres reels (production)
  pas_era5_m: 2500.0
  p_station: 0.8
  keep_train: [0.2, 1.0]
  keep_eval: 1.0

dso:
  rmse: 0.5
  r2: 0.95
  r2_all: 0.95
  mass_rms: 1.0e-4
  roughness_range: [0.9, 1.1]
  time_s: 1.0
  rmse_25pct: 0.7
  min_level_cover: 0.05

terrain_smooth_m: 300.0
f_coriolis: 8.705e-5

real:
  origin_lat: 36.395
  origin_lon: 10.04
  rotation_deg: 0.0
  origin_assumed: false
